server:
  port: 8082

spring:
  application:
    name: finops-core-ai-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/finpulse_core}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      pool-name: finops-core-hikari
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  ai:
    openai:
      api-key: ${GROQ_API_KEY:${OPENAI_API_KEY:}}
      base-url: ${GROQ_BASE_URL:https://api.groq.com/openai}
      chat:
        options:
          model: ${GROQ_MODEL:openai/gpt-oss-20b}
          temperature: ${GROQ_TEMPERATURE:${OPENAI_TEMPERATURE:0.2}}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    persistAuthorization: true
    display-request-duration: true

app:
  security:
    jwt:
      secret: ${JWT_SECRET:ZmlycHVsc2UtZGV2LXN1cGVyLXNlY3JldC1rZXktZm9yLWhtYWMtc2hhMjU2}
      access-token-expiration-minutes: ${JWT_ACCESS_TOKEN_MINUTES:120}

logging:
  level:
    com.finops.service: INFO

telemetry:
  service:
    base-url: ${TELEMETRY_SERVICE_BASE_URL:http://localhost:8081}
