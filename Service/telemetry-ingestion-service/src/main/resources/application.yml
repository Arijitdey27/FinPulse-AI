spring:
  application:
    name: telemetry-ingestion-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/telemetry_db}
    username: ${DB_USERNAME:telemetry_user}
    password: ${DB_PASSWORD:telemetry_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: telemetry-hikari-pool
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8081}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

telemetry:
  generation:
    enabled: true

core:
  service:
    base-url: ${CORE_SERVICE_BASE_URL:http://localhost:8082}
